global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # ── Application API ──────────────────────────
  - job_name: api
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: tft-agent-api

  # ── PostgreSQL exporter ──────────────────────
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  # ── Node exporter (host metrics) ─────────────
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node

  # ── cAdvisor (container metrics) ─────────────
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor

